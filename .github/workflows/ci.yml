name: Client checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          path: FlavorVoyage---client
      - uses: actions/checkout@v4
        with:
          repository: Hossain-sakib/FlavorVoyage-server
          path: FlavorVoyage-server
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: FlavorVoyage-server
      - run: npm ci
        working-directory: FlavorVoyage---client
      - run: npm run lint && npm run format:check && npm run build
        working-directory: FlavorVoyage---client
      # The hosted runner already includes Chrome and its system libraries.
      # Avoid an apt/network dependency before every browser test run.
      - run: test -x "$CHROMIUM_PATH" && "$CHROMIUM_PATH" --version
      - run: npm run test:e2e
        working-directory: FlavorVoyage---client
      - run: npm audit --omit=dev
        working-directory: FlavorVoyage---client
